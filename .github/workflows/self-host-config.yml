name: Self-host configuration

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare example configuration
        run: |
          cp .env.example .env
          sed -i 's/^DB_PASSWORD=$/DB_PASSWORD=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef/' .env
          mkdir -p config
          cp config/config.json.example config/config.json
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Validate AFFiNE config JSON
        run: python3 -m json.tool config/config.json >/dev/null
